<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Upload</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .navbar {
            background: linear-gradient(90deg, rgba(124, 123, 123, 0.95) 33%, rgba(237, 237, 237, 1) 98%);
            color: white;
            padding: 20px;
            text-align: center;
            
        }

        .navbar h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .navbar a:hover {
            color: #ff6347;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 50px;
            padding: 40px;
            max-width: 700px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            margin: 30px auto;
            z-index: 1;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        select,
        textarea,
        input[type="file"],
        input[type="radio"] {
            width: 600px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }

        input[type="radio"] {
            
            display: inline-block;
            margin-right: 10px;
        }

        textarea {
            resize: vertical;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        .form-group {
            width: 100%;
            margin-bottom: 20px;
        }

        .form-group input[type="radio"] {
            width: auto;
            display: inline-block;
            margin-right: 10px;
        }

        #custom_question_container {
            display: none;
        }

        /* Media Query for responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .navbar h2 {
                font-size: 20px;
            }

            h2 {
                font-size: 24px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-logo">
            <a href="{% url 'h' %}">
                <h2>E-Learning</h2>
            </a>
        </div>
    </nav>

    <div class="bg-img">
        <img src="{% static 'images/learning.jpg' %}" alt="Learning Background">
    </div>

    <div class="container">
        <h2>Upload Your Project</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="sample_question">Select a Sample Question:</label>
                <select id="sample_question" name="sample_question" onchange="toggleCustomQuestion()">
                    <option value="" selected disabled>Select a Sample Question</option>
                    <option value="Question 1">Question 1: Implement a To-Do List Application.</option>
                    <option value="Question 2">Question 2: Create a Calculator app.</option>
                    <option value="Question 3">Question 3: Create a Quiz App.</option>
                    <option value="Question 4">Question 4: Develop a Password Generator app.</option>
                    <option value="Question 5">Question 5: Develop a URL Shortener app.</option>
                    <option value="custom">Custom Question</option>
                </select>
            </div>

            <div id="custom_question_container" class="form-group">
                <label for="custom_question">Enter Your Custom Question:</label>
                <input type="text" id="custom_question" name="custom_question" placeholder="Enter custom question">
            </div>

            <div class="form-group">
                <label for="id_project_name">Project Name:</label>
                {{ form.project_name }}
            </div>

            <div class="form-group">
                <label for="id_file">Upload Project File:</label>
                {{ form.file }}
            </div>

            <div class="form-group">
                <label>Project Coding Language:</label>
                <input type="radio" id="python" name="project_language" value="Python"><span for="Python">Python</span>
                <input type="radio" id="html" name="project_language" value="HTML"><span for="HTML">HTML</span>
                <input type="radio" id="php" name="project_language" value="PHP"><span for="PHP">PHP</span>
            </div>

            <div class="form-group">
                <label for="id_git_link">Git Repository Link:</label>
                <input type="text"  name="git_link">
                <!-- {{ form.git_link }} -->
            </div>

            <div class="form-group">
                <label for="id_project_description">Project Description:</label>
                <textarea id="id_project_description" name="project_description" rows="4" placeholder="Describe your project..."></textarea>
            </div>

            <button type="submit">Upload Project</button>
        </form>
    </div>

    <script>
        function toggleCustomQuestion() {
            const select = document.getElementById('sample_question');
            const customQuestionContainer = document.getElementById('custom_question_container');

            if (select.value === 'custom') {
                customQuestionContainer.style.display = 'block';
            } else {
                customQuestionContainer.style.display = 'none';
            }
        }
    </script>
</body>

</html>
